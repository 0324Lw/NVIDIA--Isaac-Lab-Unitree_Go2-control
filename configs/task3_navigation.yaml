task:
  name: "go2_task3_navigation_obstacle_avoidance"
  description: "Unitree Go2 autonomous navigation, obstacle avoidance, and running."
  algorithm: "skrl_ppo"
  isaaclab: true
  world_type: "analytical_navigation_world"

world:
  pd_control_freq: 200.0
  rl_policy_freq: 50.0
  decimation: 4
  policy_dt: 0.02

  env_size: 30.0
  wall_margin: 1.5
  safe_zone_radius: 2.0

  max_episode_length_s: 30.0

  success_radius: 0.90
  success_radius_by_stage: [0.90, 0.82, 0.76, 0.70, 0.65, 0.60]

  robot_radius: 0.35
  collision_margin: 0.03
  warning_margin: 0.55

  num_lidar_rays: 90
  lidar_max_distance: 6.0
  lidar_noise_std: 0.0

  max_static_obs: 25
  max_dynamic_obs: 8

  static_radius_range: [0.30, 1.00]
  dynamic_radius_range: [0.28, 0.52]
  min_static_spacing: 0.40
  min_dynamic_spacing: 0.25
  obstacle_spawn_buffer: 0.30
  max_rejection_iters: 96

curriculum:
  curriculum_total_steps: 800000000
  stage_thresholds: [0.0, 0.08, 0.20, 0.36, 0.56, 0.78]

  goal_dist_ranges:
    - [1.6, 3.2]
    - [3.0, 5.5]
    - [4.5, 8.0]
    - [6.5, 11.0]
    - [8.5, 16.0]
    - [10.0, 22.0]

  static_count_ranges:
    - [0, 0]
    - [1, 3]
    - [3, 6]
    - [6, 10]
    - [10, 16]
    - [14, 22]

  dynamic_count_ranges:
    - [0, 0]
    - [0, 0]
    - [1, 2]
    - [2, 4]
    - [4, 6]
    - [5, 8]

  dynamic_speed_ranges:
    - [0.0, 0.0]
    - [0.0, 0.0]
    - [0.15, 0.40]
    - [0.30, 0.70]
    - [0.45, 1.00]
    - [0.60, 1.30]

  target_speed_ranges:
    - [0.30, 0.55]
    - [0.45, 0.75]
    - [0.65, 1.00]
    - [0.85, 1.30]
    - [1.00, 1.60]
    - [1.20, 1.80]

event_rewards:
  rew_success: 30.0
  rew_collision: -16.0
  rew_fall: -10.0
  rew_timeout: -6.0

privileged_features:
  privileged_static_k: 6
  privileged_dynamic_k: 4
  privileged_feature_dim: 68

future_env_expected_dims:
  actor_single_obs_dim: 257
  world_priv_dim: 68
  critic_single_obs_dim: 325
  action_dim: 12
